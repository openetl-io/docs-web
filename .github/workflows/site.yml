name: site

# Builds the site and checks its links. Cloudflare builds and deploys this
# repository's pushes itself (wrangler.toml), and openetl and
# openetl-connectors call its deploy hook when what the site reads changes.
# Run by hand on main, this builds and then calls the hook, in
# CLOUDFLARE_DEPLOY_HOOK, so Cloudflare builds and deploys main again.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request's newer run replaces its older one; on main, a run goes to
  # its end, and the next waits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch-docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm typecheck
      - run: pnpm build
      - name: Have Cloudflare build and deploy
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::No CLOUDFLARE_DEPLOY_HOOK: the site gets this with the next push to main"
            exit 1
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
