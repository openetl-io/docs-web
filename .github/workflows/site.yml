name: site

# Builds the site from openetl and openetl-connectors as they are on GitHub,
# and fails on broken links. Cloudflare Pages deploys it: its GitHub app
# builds each push, main to docs.openetl.io and other branches as previews
# (wrangler.toml).
#
# A push here is all Pages sees, so every 15 minutes this fetches the content
# repositories again and, when what it fetched, or this repository, changed
# since the last build on main, builds it and calls the Pages project's deploy
# hook, the URL in the secret CLOUDFLARE_DEPLOY_HOOK, for Pages to build and
# deploy it too. A cache entry named after a hash of both records each build.
# So a change to a page, a release branch or a published release reaches the
# site within about a quarter of an hour, and the content repositories need no
# token to tell it.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request's newer run replaces its older one; on main, a run goes to
  # its end, and the next waits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch-docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: What the site is built from
        id: inputs
        run: |
          files=$(ls -d content generated public/schemas public/logos public/_redirects 2>/dev/null)
          sum=$({ echo "$GITHUB_SHA"; find $files -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | cut -d' ' -f1)
          echo "key=site-built-$sum" >> "$GITHUB_OUTPUT"
      # A scheduled run stops here when that has been built already.
      - name: Built already
        id: built
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .built
          key: ${{ steps.inputs.outputs.key }}
          lookup-only: true
      - if: steps.built.outputs.cache-hit != 'true'
        run: pnpm typecheck
      - if: steps.built.outputs.cache-hit != 'true'
        run: pnpm build
      # A push has Pages build already; the content repositories' changes need
      # the hook.
      - name: Have Cloudflare Pages build and deploy
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.built.outputs.cache-hit != 'true'
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No CLOUDFLARE_DEPLOY_HOOK: the site gets this with Pages' next build, on a push to main"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
      # Recorded once the build, and the call to the hook, succeeded.
      - name: Record the build
        if: github.event_name != 'pull_request' && steps.built.outputs.cache-hit != 'true'
        run: echo "${{ steps.inputs.outputs.key }}" > .built
      - if: github.event_name != 'pull_request' && steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .built
          key: ${{ steps.inputs.outputs.key }}
