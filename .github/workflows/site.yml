name: site

# Builds the site and checks its links. Cloudflare deploys it from each push
# (wrangler.toml). Every 30 minutes this fetches openetl and
# openetl-connectors again and, when that or this repository changed since
# the last build, calls the deploy hook in CLOUDFLARE_DEPLOY_HOOK.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request's newer run replaces its older one; on main, a run goes to
  # its end, and the next waits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch-docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: What the site is built from
        id: inputs
        run: |
          files=$(ls -d content generated public/schemas public/logos public/_redirects 2>/dev/null)
          sum=$({ echo "$GITHUB_SHA"; find $files -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | cut -d' ' -f1)
          echo "key=site-built-$sum" >> "$GITHUB_OUTPUT"
      # A scheduled run stops here when that has been built already.
      - name: Built already
        id: built
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .built
          key: ${{ steps.inputs.outputs.key }}
          lookup-only: true
      - if: steps.built.outputs.cache-hit != 'true'
        run: pnpm typecheck
      - if: steps.built.outputs.cache-hit != 'true'
        run: pnpm build
      # Cloudflare builds a push itself.
      - name: Have Cloudflare build and deploy
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.built.outputs.cache-hit != 'true'
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No CLOUDFLARE_DEPLOY_HOOK: the site gets this with the next push to main"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
      # Recorded once the build, and the call to the hook, succeeded.
      - name: Record the build
        if: github.event_name != 'pull_request' && steps.built.outputs.cache-hit != 'true'
        run: echo "${{ steps.inputs.outputs.key }}" > .built
      - if: github.event_name != 'pull_request' && steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .built
          key: ${{ steps.inputs.outputs.key }}
