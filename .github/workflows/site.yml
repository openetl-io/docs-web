name: site

# Builds the site from openetl and openetl-connectors as they are on GitHub,
# fails on broken links, and deploys out/ to Cloudflare Pages from main.
#
# Every 15 minutes it fetches them again, and builds only when what it
# fetched, or this repository, changed since the last build on main: a cache
# entry named after a hash of both records each one. So a change to a page, a
# release branch or a published release reaches the site within about a
# quarter of an hour, and the content repositories need no token to tell it.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request's newer run replaces its older one; on main, a deploy runs
  # to its end, and the next run waits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      # Deploying needs the secret CLOUDFLARE_API_TOKEN and the variables
      # CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_PAGES_PROJECT; without them the
      # site is built and checked only.
      DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_PAGES_PROJECT != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch-docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: What the site is built from
        id: inputs
        run: |
          files=$(ls -d content generated public/schemas public/logos public/_redirects 2>/dev/null)
          sum=$({ echo "$GITHUB_SHA"; find $files -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | cut -d' ' -f1)
          echo "key=site-built-$sum" >> "$GITHUB_OUTPUT"
      # A scheduled run stops here when that has been built already.
      - name: Built already
        id: built
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .built
          key: ${{ steps.inputs.outputs.key }}
          lookup-only: true
      - if: steps.built.outputs.cache-hit != 'true'
        run: pnpm typecheck
      - if: steps.built.outputs.cache-hit != 'true'
        run: pnpm build
      - name: Deploy to Cloudflare Pages
        if: env.DEPLOY == 'true' && steps.built.outputs.cache-hit != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.153.0 pages deploy out --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT }}" --branch=main
      # Recorded once the build, and the deploy when there is one, succeeded.
      - name: Record the build
        if: github.event_name != 'pull_request' && steps.built.outputs.cache-hit != 'true'
        run: echo "${{ steps.inputs.outputs.key }}" > .built
      - if: github.event_name != 'pull_request' && steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .built
          key: ${{ steps.inputs.outputs.key }}
