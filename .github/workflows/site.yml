name: site

# Builds the site from openetl and openetl-connectors as they are on GitHub,
# fails on broken links, and deploys out/ to Cloudflare Pages from main. A
# repository_dispatch of type docs starts it, for the content repositories to
# send when their docs change or they make a release; the nightly run picks up
# what no dispatch announced.
on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [docs]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      # Deploying needs the secret CLOUDFLARE_API_TOKEN and the variables
      # CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_PAGES_PROJECT; without them the
      # site is built and checked only.
      DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_PAGES_PROJECT != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch-docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm typecheck
      - run: pnpm build
      - name: Deploy to Cloudflare Pages
        if: env.DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.153.0 pages deploy out --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT }}" --branch=main
